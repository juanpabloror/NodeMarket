<!doctype html>
<html lang="es-MX">
  <head>
    <!--@include head-shared-->
    <title>Nosotros — Node Market</title>
    <meta
      name="description"
      content="Node Market conecta negocios locales con sus clientes a través de desarrollo, redes sociales y contenido a la medida."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nosotros — Node Market" />
    <meta property="og:description" content="Por qué existe Node Market y cómo vemos a cada negocio como un nodo." />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="{{ site.marca.nombre }}" />
    <!--@if site.marca.origin-->
    <link rel="canonical" href="{{ site.marca.origin }}/nosotros/" />
    <meta property="og:url" content="{{ site.marca.origin }}/nosotros/" />
    <meta property="og:image" content="{{ site.marca.origin }}/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Node Market — Tu negocio, conectado" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--@endif-->
  </head>
  <body data-page="nosotros">
    <!--@include header-->

    <!--@include scene-->

    <main id="contenido" data-page="nosotros" data-formation="calma">
      <section class="page-hero container">
        <p data-reveal class="eyebrow">Nosotros</p>
        <h1 data-split>Cada negocio es un nodo</h1>
      </section>

      <section class="section container">
        <div class="grid-2">
          <div>
            <h2 data-split>Por qué existimos</h2>
            <p data-reveal>{{ site.nosotros.historia }}</p>
          </div>
          <div>
            <h2 data-split>Cómo vemos tu negocio</h2>
            <p data-reveal>{{ site.nosotros.vision }}</p>
          </div>
        </div>
      </section>
    </main>

    <!--@include footer-->

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
