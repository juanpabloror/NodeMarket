<!doctype html>
<html lang="es-MX">
  <head>
    <!--@include head-shared-->
    <title>Nosotros — Node Market</title>
    <meta
      name="description"
      content="Node Market conecta negocios locales con sus clientes a través de desarrollo, redes sociales y contenido a la medida."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nosotros — Node Market" />
    <meta property="og:description" content="Por qué existe Node Market y cómo vemos a cada negocio como un nodo." />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="{{ site.marca.nombre }}" />
    <!--@if site.marca.origin-->
    <link rel="canonical" href="{{ site.marca.origin }}/nosotros/" />
    <meta property="og:url" content="{{ site.marca.origin }}/nosotros/" />
    <meta property="og:image" content="{{ site.marca.origin }}/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Node Market — Tu negocio, conectado" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--@endif-->
  </head>
  <body data-page="nosotros">
    <!--@include header-->

    <!--@include scene-->

    <main id="contenido" data-page="nosotros" data-room data-formation="calma">
      <section class="page-hero page-hero--room container">
        <p data-reveal class="eyebrow">Nosotros</p>
        <h1 data-split>Cada negocio es un <em>nodo</em></h1>
      </section>

      <div class="room-ui">
        <p class="story__meta" aria-hidden="true">
          <span class="story__scene-name">La sala de la charla</span>
          <span class="story__rule"></span>
          <span class="story__count">Nosotros</span>
        </p>
        <button type="button" class="story__toggle3d" data-toggle-3d>Vista sin 3D</button>
        <button type="button" class="hotspot" data-hotspot="sofa" data-scroll-to=".room-panel"><span class="hotspot__pill"><span class="hotspot__dot" aria-hidden="true">+</span>Conócenos</span></button>
      </div>

      <div class="room-panel" data-lenis-prevent tabindex="0" role="region" aria-label="Contenido de la página">
  
        <section class="section container">
          <div class="grid-2">
            <div>
              <h2 data-split>Por qué existimos</h2>
              <p data-reveal>{{ site.nosotros.historia }}</p>
            </div>
            <div>
              <h2 data-split>Cómo vemos tu negocio</h2>
              <p data-reveal>{{ site.nosotros.vision }}</p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!--@include footer-->

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
