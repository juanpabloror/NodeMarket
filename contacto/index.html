<!doctype html>
<html lang="es-MX">
  <head>
    <!--@include head-shared-->
    <title>Contacto — Node Market</title>
    <meta
      name="description"
      content="Escríbenos por WhatsApp o cuéntanos sobre tu negocio con el formulario y platicamos sin compromiso."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contacto — Node Market" />
    <meta property="og:description" content="Conecta tu negocio con Node Market por WhatsApp o formulario." />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="{{ site.marca.nombre }}" />
    <!--@if site.marca.origin-->
    <link rel="canonical" href="{{ site.marca.origin }}/contacto/" />
    <meta property="og:url" content="{{ site.marca.origin }}/contacto/" />
    <meta property="og:image" content="{{ site.marca.origin }}/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Node Market — Tu negocio, conectado" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--@endif-->
  </head>
  <body data-page="contacto">
    <!--@include header-->

    <!--@include scene-->

    <main id="contenido" data-page="contacto" data-formation="converge">
      <section class="page-hero container">
        <p data-reveal class="eyebrow">Contacto</p>
        <h1 data-split>Conectemos tu negocio</h1>
        <p data-reveal>Escríbenos directo por WhatsApp o cuéntanos con el formulario y te respondemos por ahí.</p>
      </section>

      <section class="section container">
        <div class="grid-2">
          <div>
            <a
              data-reveal class="btn btn--accent btn--lg"
              href="https://wa.me/{{ site.contacto.whatsappNumero }}?text={{ site.contacto.whatsappMensaje | enc }}"
              target="_blank"
              rel="noopener"
            >
              Hablar por WhatsApp
            </a>
            <p data-reveal class="hero__lead" style="margin-top: var(--space-md)">
              También puedes escribirnos a
              <a href="mailto:{{ site.contacto.email }}">{{ site.contacto.email }}</a>.
            </p>
          </div>

          <form data-reveal id="contact-form" data-whatsapp="{{ site.contacto.whatsappNumero }}" novalidate>
            <div class="form-field">
              <label for="nombre">Tu nombre</label>
              <input type="text" id="nombre" name="nombre" required autocomplete="name" />
            </div>
            <div class="form-field">
              <label for="negocio">Nombre de tu negocio</label>
              <input type="text" id="negocio" name="negocio" required autocomplete="organization" />
            </div>
            <div class="form-field">
              <label for="mensaje">¿Qué necesita tu negocio?</label>
              <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn--accent">Enviar por WhatsApp</button>
          </form>
        </div>
      </section>
    </main>

    <!--@include footer-->

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
