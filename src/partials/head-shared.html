<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/src/styles/main.css" />
<script>
  (function () {
    var root = document.documentElement;
    root.classList.add('js');
    // Se decide el tema antes del primer pintado, para no parpadear entre claro y oscuro.
    // Claro es el modo por defecto, sin importar la preferencia del sistema.
    try {
      root.dataset.theme = localStorage.getItem('nm-theme') || 'light';
    } catch (e) {}
    // Si el JavaScript falla, se quita .js para que el contenido quede visible.
    setTimeout(function () {
      if (!root.classList.contains('is-ready')) root.classList.remove('js');
    }, 5000);
  })();
</script>
