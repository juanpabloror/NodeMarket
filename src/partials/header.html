<a class="skip-link" href="#contenido" data-no-swup>Saltar al contenido</a>
<div id="route-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

<header class="site-header">
  <div class="container site-header__inner">
    <a href="/" class="site-logo">
      <!--@include logo-icon-->
      <span class="site-logo__word"><b>NODE</b><span>MARKET</span></span>
    </a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle-input visually-hidden" />
    <label for="nav-toggle" class="nav-toggle">
      <span class="visually-hidden">Menú</span>
      <span class="nav-toggle__bars" aria-hidden="true"></span>
    </label>

    <nav class="site-nav" aria-label="Principal">
      <ul>
        <!--@each site.nav as item-->
        <li><a href="{{ item.href }}">{{ item.label }}</a></li>
        <!--@endeach-->
      </ul>
      <a
        class="btn btn--accent site-nav__cta"
        href="https://wa.me/{{ site.contacto.whatsappNumero }}?text={{ site.contacto.whatsappMensaje | enc }}"
        target="_blank"
        rel="noopener"
      >
        Escríbenos
      </a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Cambiar a modo claro">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" />
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" />
        </svg>
      </button>
    </nav>
  </div>
</header>
