<!doctype html>
<html lang="es-MX">
  <head>
    <!--@include head-shared-->
    <title>Preguntas frecuentes — Node Market</title>
    <meta
      name="description"
      content="Resolvemos las dudas más comunes sobre el piloto, los servicios y cómo trabajar con Node Market."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Preguntas frecuentes — Node Market" />
    <meta property="og:description" content="Dudas comunes sobre el piloto y los servicios de Node Market." />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="{{ site.marca.nombre }}" />
    <!--@if site.marca.origin-->
    <link rel="canonical" href="{{ site.marca.origin }}/preguntas-frecuentes/" />
    <meta property="og:url" content="{{ site.marca.origin }}/preguntas-frecuentes/" />
    <meta property="og:image" content="{{ site.marca.origin }}/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Node Market — Tu negocio, conectado" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--@endif-->
  </head>
  <body data-page="faq">
    <!--@include header-->

    <!--@include scene-->

    <main id="contenido" data-page="faq" data-room data-formation="calma">
      <section class="page-hero page-hero--room container">
        <p data-reveal class="eyebrow">Preguntas frecuentes</p>
        <h1 data-split>Dudas comunes, <em>respuestas claras</em></h1>
      </section>

      <div class="room-ui">
        <p class="story__meta" aria-hidden="true">
          <span class="story__scene-name">El archivero de respuestas</span>
          <span class="story__rule"></span>
          <span class="story__count">Preguntas</span>
        </p>
        <button type="button" class="story__toggle3d" data-toggle-3d>Vista sin 3D</button>
        <button type="button" class="hotspot" data-hotspot="cabinet" data-scroll-to=".room-panel"><span class="hotspot__pill"><span class="hotspot__dot" aria-hidden="true">+</span>Abre un cajón</span></button>
      </div>

      <div class="room-panel" data-lenis-prevent tabindex="0" role="region" aria-label="Contenido de la página">
  
        <section class="section container">
          <div data-stagger class="faq-list">
            <!--@each site.faq as item-->
            <details class="faq-item">
              <summary>{{ item.pregunta }}</summary>
              <p>{{ item.respuesta }}</p>
            </details>
            <!--@endeach-->
          </div>
        </section>
      </div>
    </main>

    <!--@include footer-->

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
