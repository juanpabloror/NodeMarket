<!doctype html>
<html lang="es-MX">
  <head>
    <!--@include head-shared-->
    <title>Página no encontrada — Node Market</title>
    <meta name="description" content="La página que buscas no existe o cambió de lugar. Vuelve al inicio de Node Market." />
    <meta name="robots" content="noindex" />
  </head>
  <body data-page="notfound">
    <!--@include header-->

    <!--@include scene-->

    <main id="contenido" data-page="notfound" data-room data-formation="calma">
      <section class="page-hero page-hero--room container">
        <p data-reveal class="eyebrow">Error 404</p>
        <h1 data-split>Esta página <em>no existe</em></h1>
        <p data-reveal>Puede que el enlace haya cambiado. Te llevamos de vuelta al inicio para retomar el camino.</p>
      </section>

      <div class="room-ui">
        <p class="story__meta" aria-hidden="true">
          <span class="story__scene-name">La puerta de entrada</span>
          <span class="story__rule"></span>
          <span class="story__count">Error 404</span>
        </p>
        <button type="button" class="story__toggle3d" data-toggle-3d>Vista sin 3D</button>
        <a class="hotspot" data-hotspot="door" href="/"><span class="hotspot__pill"><span class="hotspot__dot" aria-hidden="true">↗</span>Volver al inicio</span></a>
      </div>

      <div class="room-panel" data-lenis-prevent tabindex="0" role="region" aria-label="Contenido de la página">
  
        <section class="section container">
          <a data-reveal class="btn btn--accent btn--lg" href="/">Volver al inicio</a>
        </section>
      </div>
    </main>

    <!--@include footer-->

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
